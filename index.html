<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>从零学琴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Music&family=Noto+Serif+SC:wght@700&display=swap">
<style>
/* Layout: one-screen app. Scrolling lesson pane on top, a real keyboard docked at the bottom under a strip of red felt. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --fg:#16181D; --muted:#5E6470; --line:#D5D9E0;
  --accent:#B4233C; --accent-ink:#FFFFFF; --accent-soft:#F6DCE1;
  --brass:#8F6A1B; --ok:#1F7A4D; --ok-soft:#D9F0E4; --bad:#B45309; --bad-soft:#FBE7CF;
  --key-white:#FBFAF5; --key-black:#1B1C20; --key-edge:#C3C7CF; --key-label:#5E6470; --key-down:#E2E4E9;
  --font-display:"Noto Serif SC","Songti SC","STSong",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-latin:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121317; --surface:#1C1E24; --fg:#ECEEF2; --muted:#9AA1AE; --line:#2E323B;
  --accent:#E2546B; --accent-ink:#1A0A0D; --accent-soft:#3A1A21;
  --brass:#D9B25A; --ok:#4CC38A; --ok-soft:#163326; --bad:#F0A04B; --bad-soft:#3A2812;
  --key-white:#EDEBE3; --key-black:#08080A; --key-edge:#55585F; --key-label:#5E6470; --key-down:#CFCDC4;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1C1E24; --fg:#ECEEF2; --muted:#9AA1AE; --line:#2E323B;
  --accent:#E2546B; --accent-ink:#1A0A0D; --accent-soft:#3A1A21;
  --brass:#D9B25A; --ok:#4CC38A; --ok-soft:#163326; --bad:#F0A04B; --bad-soft:#3A2812;
  --key-white:#EDEBE3; --key-black:#08080A; --key-edge:#55585F; --key-label:#5E6470; --key-down:#CFCDC4;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#main{flex:1;min-height:0;overflow-y:auto;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.eyebrow{margin:0;font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:600}
h1{margin:0;font-family:var(--font-display);font-size:38px;line-height:1.15;text-wrap:balance}
h2{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.25;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px 2px}
.row .n{font-family:var(--font-latin);font-weight:700;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .t{min-width:0;display:flex;flex-direction:column}
.row .t b{font-size:17px}
.row .t small{font-size:13.5px;color:var(--muted)}
.row.next .n{color:var(--accent)}
.pill{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;vertical-align:2px}
.stars{font-size:16px;letter-spacing:2px;color:var(--brass);white-space:nowrap}
.stars s{text-decoration:none;color:var(--line)}
.tip{margin:0;font-size:13.5px;color:var(--muted)}

.crumb{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.back{padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--fg);font-size:14px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:34em}
.prose p{margin:0}
.prose strong{color:var(--accent)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{display:block;width:100%;height:auto}
.btn{align-self:flex-start;padding:12px 22px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stage.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ask{margin:0;font-family:var(--font-display);font-size:32px;line-height:1.2}
.ask .L{font-family:var(--font-latin);font-size:44px;color:var(--accent)}
.hintline{margin:0;color:var(--muted);font-size:15px;min-height:1.6em}
.hintline.warn{color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:6px 4px}
.chip{flex:0 0 calc(var(--d,1) * 40px - 4px);min-width:28px;height:54px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip b{font-family:var(--font-latin);font-size:18px}
.chip i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.done i{color:var(--ok)}
.chip.cur{border:2px solid var(--accent);background:var(--accent-soft)}
.chip.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.play i{color:var(--accent-ink)}
.legend{margin:0;font-size:12.5px;color:var(--muted)}

.result{align-items:flex-start}
.result .stars{font-size:34px;letter-spacing:6px}

#dock{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dockin{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.tog{padding:5px 12px;border:1px solid var(--line);border-radius:99px;color:var(--fg);background:var(--bg)}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tools .heard{margin-left:auto;font-family:var(--font-latin);font-weight:700;font-size:18px;color:var(--fg);min-width:2.2em;text-align:right}
.micmsg{flex-basis:100%;margin:0;color:var(--bad)}
.felt{height:5px;background:var(--accent);border-radius:2px 2px 0 0}
#keys{position:relative;display:flex;height:clamp(140px,26vh,210px);touch-action:none;user-select:none;-webkit-user-select:none}
.wk{flex:1;min-width:0;background:var(--key-white);border:1px solid var(--key-edge);border-top:0;margin-left:-1px;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--font-latin);font-weight:700;font-size:15px;color:var(--key-label)}
.wk:first-child{margin-left:0}
.bk{position:absolute;top:0;height:60%;background:var(--key-black);border-radius:0 0 4px 4px;z-index:2}
#keys.nolabel .wk span{visibility:hidden}
.wk.down{background:var(--key-down)}
.bk.down{opacity:.75}
.wk.hint,.bk.hint{background:var(--accent);color:var(--accent-ink)}
.wk.ok,.bk.ok{background:var(--ok);color:var(--key-white)}
.wk.bad,.bk.bad{background:var(--bad);color:var(--key-white)}
@media (prefers-reduced-motion: reduce){ .stage.miss{animation:none} }
</style>

<main id="main"></main>
<footer id="dock">
  <div class="dockin">
    <div class="tools" id="tools"></div>
    <div>
      <div class="felt"></div>
      <div id="keys" aria-label="钢琴键盘"></div>
    </div>
  </div>
</footer>

<script>
const MIC_BUILD = true;
const LO = 60, HI = 76, BEAT = 600, STORE = 'zero-piano-v1';
const PC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOL = {C:'do',D:'re',E:'mi',F:'fa',G:'sol',A:'la',B:'si'};
const BASE = {C:60,D:62,E:64,F:65,G:67,A:69,B:71};
const FIVE = {60:1,62:2,64:3,65:4,67:5};
const isBlack = m => [1,3,6,8,10].includes(m % 12);
const nm = m => PC[m % 12];
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* "E E3 G:2 C'" -> notes. Letter, optional ' for the upper octave, optional finger 1-5, optional :beats */
function seq(str, autoFinger){
  return str.trim().split(/\s+/).map(t => {
    const x = /^([A-G])('?)([1-5])?(?::([\d.]+))?$/.exec(t);
    const m = BASE[x[1]] + (x[2] ? 12 : 0);
    return { m, f: x[3] ? +x[3] : (autoFinger ? FIVE[m] || null : null), d: x[4] ? +x[4] : 1 };
  });
}
function pick(pool, n, make){
  const out = []; let last = -1;
  while (out.length < n){
    const m = pool[Math.floor(Math.random() * pool.length)];
    if (m === last) continue;
    last = m; out.push(make(m));
  }
  return out;
}

const LESSONS = [
  { title:'认识键盘', sub:'靠黑键找到 C 和 F', labels:false,
    intro:[
      '钢琴的白键看起来都一样，要靠黑键认路。黑键按<strong>两个一组、三个一组</strong>交替排列。',
      '<strong>两个黑键</strong>左边紧挨着的白键是 C。键盘正中间的那个 C 叫中央 C，是初学者的起点。',
      '<strong>三个黑键</strong>左边紧挨着的白键是 F。记住这两个位置，其他音都能数出来。',
      '在你的电子琴上找中央 C：61 键的琴是从左数第 3 个 C，88 键的琴是第 4 个 C，通常正对着琴的商标。'],
    parts:() => [{ mode:'name', notes:[
      {m:60,pc:1,text:'找到 <span class="L">C</span>',tip:'两个黑键左边的白键'},
      {m:65,pc:1,text:'找到 <span class="L">F</span>',tip:'三个黑键左边的白键'},
      {m:62,pc:1,text:'找到 <span class="L">D</span>',tip:'两个黑键中间的白键'},
      {m:64,pc:1,text:'找到 <span class="L">E</span>',tip:'两个黑键右边的白键'},
      {m:72,text:'找到高一组的 <span class="L">C</span>',tip:'键盘右半边，两个黑键左边'},
      {m:60,text:'回到中央 <span class="L">C</span>',tip:'键盘左半边的那个 C'}]}] },
  { title:'七个音名', sub:'C D E F G A B 与 do re mi', labels:false,
    intro:[
      '白键从 C 开始依次是 <strong>C D E F G A B</strong>，对应唱名 do re mi fa sol la si。',
      '到 B 之后又回到 C，声音高了一组，叫一个八度。所以认识七个音，就认识了整个键盘。',
      '练习时屏幕键盘上的字母会先藏起来。连错两次，正确的键会亮起来。'],
    parts:() => [{ mode:'name', notes: pick([60,62,64,65,67,69,71], 10, m => (
      {m,pc:1,text:'弹 <span class="L">'+nm(m)+'</span>',tip:'唱名 '+SOL[nm(m)]})) }] },
  { title:'右手五指位', sub:'五个手指，各管一个键', labels:true,
    intro:[
      '手指有编号：拇指 <strong>1</strong>，食指 <strong>2</strong>，中指 <strong>3</strong>，无名指 <strong>4</strong>，小指 <strong>5</strong>。',
      '右手拇指放在中央 C，五个手指依次落在 C D E F G。每个手指只管自己的键，手不用移动。',
      '手型像轻轻握着一个小球，用指尖触键，手腕放平。每个格子下面的小数字就是该用的手指。'],
    parts:() => [
      {mode:'seq',label:'上行',notes:seq('C D E F G:2',1)},
      {mode:'seq',label:'下行',notes:seq('G F E D C:2',1)},
      {mode:'seq',label:'跳着弹',notes:seq('C E G E C:2',1)},
      {mode:'seq',label:'上去再回来',notes:seq('C D E F G F E D C:2',1)}] },
  { title:'读五线谱', sub:'从中央 C 到 G', labels:true, fig:true,
    intro:[
      '五线谱有五条线和四个间。音符画得越高，声音越高，对应键盘上越靠右。',
      '<strong>中央 C</strong> 在五条线的下方，自己带一条短横线。往上依次是：D 挂在第一条线下面，E 压在第一条线上，F 在第一间，G 压在第二条线上。',
      '规律是一线一间交替往上走，和键盘上相邻的白键一一对应。'],
    parts:() => [{ mode:'staff', notes: pick([60,62,64,65,67], 10, m => ({m})) }] },
  { title:'节拍与时值', sub:'用《玛丽有只小羊羔》练长短', labels:true,
    intro:[
      '音符有长短。<strong>四分音符</strong>占 1 拍，<strong>二分音符</strong>占 2 拍，<strong>全音符</strong>占 4 拍。',
      '练习里的格子越宽，这个音按得越久。先点「听示范」感受速度，再自己弹。',
      '这一课只判断音对不对，不赶时间。音都弹对之后，再试着跟上示范的速度。'],
    parts:() => [
      {mode:'seq',label:'第 1 句',notes:seq('E D C D E E E:2',1)},
      {mode:'seq',label:'第 2 句',notes:seq('D D D:2 E G G:2',1)},
      {mode:'seq',label:'第 3 句',notes:seq('E D C D E E E E',1)},
      {mode:'seq',label:'第 4 句',notes:seq('D D E D C:4',1)}] },
  { title:'《欢乐颂》', sub:'第一首完整的曲子', labels:true,
    intro:[
      '贝多芬《欢乐颂》的主旋律只用到 C D E F G 五个音。右手保持五指位，不用移动就能弹完。',
      '注意每句结尾的节奏：一个长一点的音（1 拍半），接一个很短的音（半拍），再接 2 拍的长音。'],
    parts:() => [
      {mode:'seq',label:'第 1 句',notes:seq('E E F G G F E D',1)},
      {mode:'seq',label:'第 2 句',notes:seq('C C D E E:1.5 D:.5 D:2',1)},
      {mode:'seq',label:'第 3 句',notes:seq('E E F G G F E D',1)},
      {mode:'seq',label:'第 4 句',notes:seq('C C D E D:1.5 C:.5 C:2',1)}] },
  { title:'《小星星》', sub:'多伸一个键，弹到 A', labels:true,
    intro:[
      '这首曲子要用到 <strong>A</strong>，比五指位多出一个键。',
      '弹到 A 时，小指向右伸一个键，弹完再回到 G。其余的音手指照旧。'],
    parts:() => [
      {mode:'seq',label:'第 1 句',notes:seq('C1 C1 G5 G5 A5 A5 G5:2')},
      {mode:'seq',label:'第 2 句',notes:seq('F4 F4 E3 E3 D2 D2 C1:2')},
      {mode:'seq',label:'第 3 句',notes:seq('G5 G5 F4 F4 E3 E3 D2:2')},
      {mode:'seq',label:'第 4 句',notes:seq('G5 G5 F4 F4 E3 E3 D2:2')},
      {mode:'seq',label:'第 5 句',notes:seq('C1 C1 G5 G5 A5 A5 G5:2')},
      {mode:'seq',label:'第 6 句',notes:seq('F4 F4 E3 E3 D2 D2 C1:2')}] }
];

/* ---------- saved progress (this device only) ---------- */
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} }

/* ---------- state ---------- */
const S = { view:'home', li:0, stage:'intro', parts:[], pi:0, ni:0, mistakes:0, miss:0, total:0, demo:0, demoIdx:-1, labels:null, heard:'', micMsg:'' };
const lesson = () => LESSONS[S.li];
const part = () => S.parts[S.pi];
const target = () => part().notes[S.ni];

/* ---------- sound ---------- */
let ctx = null, master = null;
function ac(){
  if (!ctx){
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    ctx = new A();
    master = ctx.createGain(); master.gain.value = 0.8;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function playNote(m, dur){
  const c = ac(); if (!c) return;
  dur = dur || 1.3;
  const t = c.currentTime, f = 440 * Math.pow(2, (m - 69) / 12);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur + 0.6);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3200, t);
  lp.frequency.exponentialRampToValueAtTime(900, t + dur);
  [[1,'triangle',1],[2,'sine',0.35],[3,'sine',0.12]].forEach(h => {
    const o = c.createOscillator(), og = c.createGain();
    o.type = h[1]; o.frequency.value = f * h[0]; og.gain.value = h[2];
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.7);
  });
  lp.connect(g); g.connect(master);
}

/* ---------- keyboard ---------- */
const keys = $('#keys');
function buildKeys(){
  const whites = []; for (let m = LO; m <= HI; m++) if (!isBlack(m)) whites.push(m);
  const w = 100 / whites.length;
  let html = whites.map(m => '<div class="wk" data-m="'+m+'"><span>'+nm(m)+'</span></div>').join('');
  for (let m = LO; m <= HI; m++) if (isBlack(m)){
    const left = (whites.indexOf(m - 1) + 1) * w - w * 0.3;
    html += '<div class="bk" data-m="'+m+'" style="left:'+left.toFixed(3)+'%;width:'+(w*0.6).toFixed(3)+'%"></div>';
  }
  keys.innerHTML = html;
}
const keyEl = m => keys.querySelector('[data-m="'+m+'"]');
function flash(m, cls, ms){
  const el = keyEl(m); if (!el) return;
  el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms || 320);
}
function inRange(m){ let k = LO + ((m - LO) % 12 + 12) % 12; return k; }
const held = new Map();
keys.addEventListener('pointerdown', e => {
  const k = e.target.closest('[data-m]'); if (!k) return;
  e.preventDefault();
  held.set(e.pointerId, k); k.classList.add('down');
  onNote(+k.dataset.m, 'touch');
});
function release(e){ const k = held.get(e.pointerId); if (k){ k.classList.remove('down'); held.delete(e.pointerId); } }
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

/* ---------- lesson engine ---------- */
function openLesson(i){
  S.view = 'lesson'; S.li = i; S.stage = 'intro'; S.demo = 0; S.demoIdx = -1; S.labels = null;
  render(true);
}
function startPlay(){
  S.parts = lesson().parts(); S.pi = 0; S.ni = 0; S.mistakes = 0; S.miss = 0; S.demo = 0; S.demoIdx = -1;
  S.total = S.parts.reduce((a, p) => a + p.notes.length, 0);
  S.stage = 'play'; render(true);
}
function matches(m, src){
  const t = target();
  return (src === 'mic' || t.pc) ? (m % 12 === t.m % 12) : m === t.m;
}
function onNote(m, src){
  if (src === 'touch'){ playNote(m); mic.muteUntil = performance.now() + 700; }
  if (S.view !== 'lesson' || S.stage !== 'play' || S.demo) return;
  const shown = src === 'mic' ? inRange(m) : m;
  if (matches(m, src)){
    flash(shown, 'ok');
    S.ni++; S.miss = 0;
    if (S.ni >= part().notes.length){ S.pi++; S.ni = 0; }
    if (S.pi >= S.parts.length) return finish();
    render();
  } else {
    flash(shown, 'bad');
    S.mistakes++; S.miss++;
    render();
    const st = $('.stage'); if (st) st.classList.add('miss');
  }
}
function finish(){
  const stars = S.mistakes === 0 ? 3 : S.mistakes <= 3 ? 2 : 1;
  saved[S.li] = Math.max(saved[S.li] || 0, stars); save();
  S.lastStars = stars; S.stage = 'done'; render(true);
}
let demoTok = 0;
async function demo(){
  if (S.demo){ S.demo = 0; S.demoIdx = -1; render(); return; }
  const tok = ++demoTok; S.demo = tok;
  const notes = part().notes;
  for (let i = 0; i < notes.length; i++){
    if (S.demo !== tok) return;
    S.demoIdx = i; render();
    playNote(notes[i].m, notes[i].d * BEAT / 1000);
    flash(notes[i].m, 'down', notes[i].d * BEAT * 0.8);
    await sleep(notes[i].d * BEAT);
  }
  if (S.demo === tok){ S.demo = 0; S.demoIdx = -1; mic.muteUntil = performance.now() + 900; render(); }
}

/* ---------- staff drawing ---------- */
function step(m){ return {0:0,2:1,4:2,5:3,7:4,9:5,11:6}[m % 12] + 7 * (Math.floor(m / 12) - 5); }
function staffSVG(ms, withNames){
  const W = 300, H = withNames ? 132 : 116, bottom = 83, gap = 12;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="五线谱"><g stroke="var(--fg)" stroke-width="1.2" fill="none">';
  for (let i = 0; i < 5; i++) s += '<line x1="6" x2="'+(W-6)+'" y1="'+(bottom - i*gap)+'" y2="'+(bottom - i*gap)+'"/>';
  s += '</g><text x="10" y="97" font-size="70" fill="var(--fg)" style="font-family:\'Noto Music\',\'Apple Symbols\',\'Segoe UI Symbol\',serif">&#x1D11E;</text>';
  const x0 = 96, dx = ms.length > 1 ? (W - 30 - x0) / (ms.length - 1) : 0;
  ms.forEach((m, i) => {
    const x = ms.length > 1 ? x0 + dx * i : 170, y = bottom - (step(m) - 2) * 6;
    if (step(m) === 0) s += '<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="'+y+'" y2="'+y+'" stroke="var(--fg)" stroke-width="1.2"/>';
    s += '<ellipse cx="'+x+'" cy="'+y+'" rx="8" ry="5.8" transform="rotate(-20 '+x+' '+y+')" fill="var(--accent)"/>';
    s += '<line x1="'+(x+7.4)+'" x2="'+(x+7.4)+'" y1="'+(y-1.5)+'" y2="'+(y-36)+'" stroke="var(--accent)" stroke-width="1.6"/>';
    if (withNames) s += '<text x="'+x+'" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)" style="font-family:var(--font-latin)">'+nm(m)+'</text>';
  });
  return s + '</svg>';
}

/* ---------- views ---------- */
function starsHTML(n){ return '<span class="stars" aria-label="'+n+' 颗星">'+'★'.repeat(n)+'<s>'+'★'.repeat(3-n)+'</s></span>'; }
function homeHTML(){
  const done = LESSONS.filter((_, i) => saved[i]).length;
  let next = LESSONS.findIndex((_, i) => !saved[i]);
  const rows = LESSONS.map((l, i) =>
    '<li><button class="row'+(i === next ? ' next' : '')+'" data-act="open" data-i="'+i+'" id="lesson-'+i+'">'+
    '<span class="n">'+(i+1)+'</span><span class="t"><b>'+l.title+(i === next ? '<span class="pill">'+(done ? '继续' : '从这里开始')+'</span>' : '')+'</b><small>'+l.sub+'</small></span>'+
    (saved[i] ? starsHTML(saved[i]) : '<span></span>')+'</button></li>').join('');
  return '<div class="wrap"><header class="hero"><p class="eyebrow">钢琴入门 · 右手篇</p><h1>从零学琴</h1>'+
    '<p class="lede">七节课，从认识键盘到弹完《小星星》。每课大约 5 分钟。</p>'+
    '<div class="prog"><span>已完成 '+done+' / '+LESSONS.length+' 课</span><div class="bar"><i style="width:'+(done/LESSONS.length*100)+'%"></i></div></div></header>'+
    (MIC_BUILD ? setupHTML() : '')+
    '<ol class="lessons">'+rows+'</ol>'+
    '<p class="tip">'+(MIC_BUILD ? '屏幕上的键盘是示意图，告诉你该弹哪个键，也可以直接点。' : '下面的键盘随时可以弹。没有声音时，先检查手机的静音键和音量。')+'进度只保存在这台设备上。</p></div>';
}
function setupHTML(){
  const live = mic.on || midi.on;
  let h = '<section class="stage"><div class="meta"><span>第一步 · 让设备听到你的琴</span><span>'+(live ? '正在听' : '未连接')+'</span></div>';
  if (live) h += '<p class="ask">弹一下中央 <span class="L">C</span></p><p class="hintline">听到的音：<b class="heard">'+(S.heard || '…')+'</b>。显示 C 就可以开始第 1 课。</p>';
  else h += '<p class="hintline">把手机放在琴的喇叭旁边，琴的音量开到中等以上，然后打开麦克风。</p>'+
    '<div class="btns"><button class="btn" data-act="mic" id="setup-mic">打开麦克风</button>'+
    (navigator.requestMIDIAccess ? '<button class="btn ghost" data-act="midi" id="setup-midi">用数据线连接</button>' : '')+'</div>';
  if (S.micMsg) h += '<p class="micmsg">'+S.micMsg+'</p>';
  return h + '</section>';
}
function lessonHTML(){
  const l = lesson();
  let h = '<div class="wrap"><div class="crumb"><button class="back" data-act="home" id="back">‹ 目录</button><span>第 '+(S.li+1)+' 课 · '+l.title+'</span></div>';
  if (S.stage === 'intro'){
    h += '<h2>'+l.title+'</h2><div class="prose">'+l.intro.map(p => '<p>'+p+'</p>').join('')+'</div>';
    if (l.fig) h += '<div class="fig">'+staffSVG([60,62,64,65,67], true)+'</div>';
    h += '<button class="btn" data-act="start" id="start">开始练习</button>';
  } else if (S.stage === 'play'){
    const p = part(), t = target();
    const doneCount = S.parts.slice(0, S.pi).reduce((a, q) => a + q.notes.length, 0) + S.ni;
    h += '<div class="stage"><div class="meta"><span>'+(p.label ? p.label+' · ' : '')+'进度 '+doneCount+' / '+S.total+'</span><span>错 '+S.mistakes+' 次</span></div>';
    const warn = S.miss >= 2;
    if (p.mode === 'name'){
      h += '<p class="ask">'+t.text+'</p><p class="hintline'+(warn ? ' warn' : '')+'">'+(warn ? '看亮起来的键：' : '')+t.tip+'</p>';
    } else if (p.mode === 'staff'){
      h += '<div class="fig">'+staffSVG([t.m], false)+'</div><p class="hintline'+(warn ? ' warn' : '')+'">'+(warn ? '这个音是 '+nm(t.m)+'，看亮起来的键' : '这是哪个音？在琴上弹出来')+'</p>';
    } else {
      h += '<div class="chips">'+p.notes.map((n, k) => {
        const cls = S.demo ? (k === S.demoIdx ? ' play' : '') : (k < S.ni ? ' done' : k === S.ni ? ' cur' : '');
        return '<div class="chip'+cls+'" style="--d:'+n.d+'"><b>'+nm(n.m)+'</b>'+(n.f ? '<i>'+n.f+'</i>' : '')+'</div>';
      }).join('')+'</div><p class="legend">格子越宽，音越长。小数字是手指编号。'+(warn && !S.demo ? '下一个音是 '+nm(t.m)+'。' : '')+'</p>'+
      '<div class="btns"><button class="btn ghost" data-act="demo" id="demo">'+(S.demo ? '停止示范' : '听示范')+'</button></div>';
    }
    h += '</div>';
  } else {
    const hasNext = S.li + 1 < LESSONS.length;
    h += '<div class="stage result"><h2>这一课完成了</h2>'+starsHTML(S.lastStars)+
      '<p class="lede">共 '+S.total+' 个音，错了 '+S.mistakes+' 次。'+(S.lastStars === 3 ? '一次都没错。' : '再练一遍，争取全对。')+'</p>'+
      '<div class="btns">'+(hasNext ? '<button class="btn" data-act="next" id="next">下一课</button>' : '')+
      '<button class="btn ghost" data-act="start" id="retry">再练一遍</button><button class="btn ghost" data-act="home" id="tohome">回目录</button></div></div>';
  }
  return h + '</div>';
}
function labelsOn(){ return S.labels !== null ? S.labels : (S.view === 'home' ? true : lesson().labels !== false); }
function renderTools(){
  let h = '<button class="tog" data-act="labels" id="labels" aria-pressed="'+labelsOn()+'">键上音名：'+(labelsOn() ? '显示' : '隐藏')+'</button>';
  if (MIC_BUILD){
    h += '<button class="tog" data-act="mic" id="mic" aria-pressed="'+mic.on+'">麦克风听音：'+(mic.on ? '开' : '关')+'</button>';
    if (mic.on) h += '<span class="heard" aria-label="听到的音">'+(S.heard || '…')+'</span>';
    if (navigator.requestMIDIAccess) h += '<button class="tog" data-act="midi" id="midi" aria-pressed="'+midi.on+'">电子琴连线：'+(midi.on ? '已连接' : '未连接')+'</button>';
    if (S.micMsg) h += '<p class="micmsg">'+S.micMsg+'</p>';
  }
  $('#tools').innerHTML = h;
}
function render(top){
  const M = $('#main');
  M.innerHTML = S.view === 'home' ? homeHTML() : lessonHTML();
  if (top) M.scrollTop = 0;
  keys.classList.toggle('nolabel', !labelsOn());
  keys.querySelectorAll('.hint').forEach(k => k.classList.remove('hint'));
  if (S.view === 'lesson' && S.stage === 'play' && !S.demo && (S.miss >= 2 || part().mode === 'seq')){
    const k = keyEl(target().m); if (k) k.classList.add('hint');
  }
  renderTools();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  ac();
  if (a === 'open') openLesson(+b.dataset.i);
  else if (a === 'start') startPlay();
  else if (a === 'demo') demo();
  else if (a === 'next') openLesson(S.li + 1);
  else if (a === 'home'){ S.view = 'home'; S.demo = 0; S.labels = null; render(true); }
  else if (a === 'labels'){ S.labels = !labelsOn(); render(); }
  else if (a === 'mic') micToggle();
  else if (a === 'midi') midiConnect();
});

/* ---------- electronic keyboard over USB / Bluetooth MIDI (self-hosted build, browsers with Web MIDI) ---------- */
const midi = { on:false };
async function midiConnect(){
  S.micMsg = '';
  try {
    const acc = await navigator.requestMIDIAccess();
    const hook = () => {
      let n = 0;
      acc.inputs.forEach(inp => { n++; inp.onmidimessage = ev => {
        const d = ev.data;
        if ((d[0] & 0xf0) === 0x90 && d[2] > 0){
          setHeard(nm(d[1]));
          if (S.view === 'lesson' && S.stage === 'play') onNote(d[1], 'mic'); else flash(inRange(d[1]), 'down', 250);
        }
      }; });
      midi.on = n > 0;
      if (!n) S.micMsg = '没有找到电子琴。用数据线把琴连到这台设备，打开琴的电源后再点一次。';
      render();
    };
    acc.onstatechange = hook; hook();
  } catch (err){
    S.micMsg = '浏览器没有允许连接电子琴。';
    render();
  }
}

function setHeard(n){ S.heard = n; document.querySelectorAll('.heard').forEach(e => e.textContent = n); }

/* ---------- microphone listening (only in the self-hosted build) ---------- */
const mic = { on:false, stream:null, an:null, buf:null, timer:0, last:-1, stable:0, fired:false, minSince:0, muteUntil:0 };
function detectPitch(buf, sr){
  let n = buf.length, sum = 0;
  for (let i = 0; i < n; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / n);
  if (rms < 0.012) return { f:-1, rms };
  let r1 = 0, r2 = n - 1; const th = 0.2;
  for (let i = 0; i < n / 2; i++) if (Math.abs(buf[i]) < th){ r1 = i; break; }
  for (let i = 1; i < n / 2; i++) if (Math.abs(buf[n - i]) < th){ r2 = n - i; break; }
  const b = buf.subarray(r1, r2); n = b.length;
  if (n < 400) return { f:-1, rms };
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++){ let a = 0; for (let j = 0; j < n - i; j++) a += b[j] * b[j + i]; c[i] = a; }
  let d = 0; while (d < n - 2 && c[d] > c[d + 1]) d++;
  let mv = -1, mp = -1;
  for (let i = d; i < n; i++) if (c[i] > mv){ mv = c[i]; mp = i; }
  if (mp <= 0 || mv < c[0] * 0.3) return { f:-1, rms };
  let T = mp;
  if (mp > 0 && mp < n - 1){
    const x1 = c[mp - 1], x2 = c[mp], x3 = c[mp + 1], a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
    if (a) T = mp - bb / (2 * a);
  }
  return { f: sr / T, rms };
}
function micTick(){
  if (S.demo || performance.now() < mic.muteUntil){ mic.last = -1; mic.stable = 0; mic.fired = false; return; }
  mic.an.getFloatTimeDomainData(mic.buf);
  const r = detectPitch(mic.buf, ctx.sampleRate);
  if (r.f < 0){ mic.last = -1; mic.stable = 0; mic.fired = false; return; }
  const m = Math.round(69 + 12 * Math.log2(r.f / 440));
  if (m < 48 || m > 96) return;
  if (m === mic.last) mic.stable++; else { mic.last = m; mic.stable = 1; mic.fired = false; }
  if (mic.fired){
    mic.minSince = Math.min(mic.minSince, r.rms);
    if (r.rms > mic.minSince * 1.7){ mic.fired = false; mic.stable = 2; }
  }
  if (!mic.fired && mic.stable >= 3){
    mic.fired = true; mic.minSince = r.rms;
    setHeard(nm(m));
    if (S.view === 'lesson' && S.stage === 'play') onNote(m, 'mic'); else flash(inRange(m), 'down', 250);
  }
}
async function micToggle(){
  S.micMsg = '';
  if (mic.on){
    clearInterval(mic.timer);
    if (mic.stream) mic.stream.getTracks().forEach(t => t.stop());
    mic.on = false; S.heard = '';
  } else {
    try {
      const c = ac();
      if (!c || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      mic.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      const src = c.createMediaStreamSource(mic.stream);
      mic.an = c.createAnalyser(); mic.an.fftSize = 2048;
      src.connect(mic.an);
      mic.buf = new Float32Array(mic.an.fftSize);
      mic.timer = setInterval(micTick, 50);
      mic.on = true;
    } catch (err){
      S.micMsg = '没有拿到麦克风。请在浏览器里允许这个页面使用麦克风，并确认页面是通过 https 打开的。';
    }
  }
  render();
}

buildKeys();
render(true);
</script>
</body></html>
